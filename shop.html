<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Amero</title>
  <meta name="description" content="Browse all Amero premium shirts and t-shirts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR (injected by js/layout.js) -->
  <header id="site-nav"></header>

  <!-- PAGE HEADER -->
  <header class="page-section" style="padding-top: calc(var(--nav-height) + var(--sp-3xl)); padding-bottom: var(--sp-2xl);">
    <div class="container">
      <div class="section-header reveal">
        <h2>Shop</h2>
        <p>All Products</p>
      </div>
    </div>
  </header>

  <!-- FILTER BAR -->
  <section class="page-section" style="padding-top: 0;">
    <div class="container">
      <div class="filter-bar reveal">
        <div class="filter-chips" id="categoryFilter" role="group" aria-label="Filter by category">
          <button class="filter-chip active" data-category="all" aria-pressed="true">All</button>
          <button class="filter-chip" data-category="shirts" aria-pressed="false">Shirts</button>
          <button class="filter-chip" data-category="t-shirts" aria-pressed="false">T-Shirts</button>
        </div>
        <div class="filter-group">
          <label for="sortSelect">Sort by</label>
          <select id="sortSelect">
            <option value="default">Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name">Name (A&ndash;Z)</option>
          </select>
        </div>
      </div>

      <div class="product-count" id="productCount"></div>

      <div class="products-grid" id="productsGrid"></div>
    </div>
  </section>

  <!-- FOOTER (injected by js/layout.js) -->
  <footer id="site-footer"></footer>

  <!-- SCRIPTS -->
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* SHOP PAGE — filter, sort, and render all products */
    (function () {
      const grid = document.getElementById('productsGrid');
      const countEl = document.getElementById('productCount');

      let activeCategory = 'all';
      let sortKey = 'default';

      function getFilteredProducts() {
        let list = products.filter(p => activeCategory === 'all' || p.category === activeCategory);
        switch (sortKey) {
          case 'price-asc':
            list.sort((a, b) => a.price - b.price);
            break;
          case 'price-desc':
            list.sort((a, b) => b.price - a.price);
            break;
          case 'name':
            list.sort((a, b) => a.name.localeCompare(b.name));
            break;
        }
        return list;
      }

      function render() {
        const list = getFilteredProducts();
        countEl.textContent = list.length + ' product' + (list.length !== 1 ? 's' : '');

        if (list.length === 0) {
          grid.innerHTML = '<div class="empty-state reveal in-view"><p>No products found.</p><a href="shop.html" class="btn btn-ghost">Reset filters</a></div>';
          return;
        }

        grid.innerHTML = list.map(p => productCardMarkup(p)).join('');
        initScrollReveal();
      }

      /* Category filter chips (toggle aria-pressed for assistive tech) */
      document.getElementById('categoryFilter').addEventListener('click', (e) => {
        const chip = e.target.closest('.filter-chip');
        if (!chip) return;
        document.querySelectorAll('#categoryFilter .filter-chip').forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-pressed', 'false');
        });
        chip.classList.add('active');
        chip.setAttribute('aria-pressed', 'true');
        activeCategory = chip.dataset.category;
        render();
      });

      /* Sort select */
      document.getElementById('sortSelect').addEventListener('change', (e) => {
        sortKey = e.target.value;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
