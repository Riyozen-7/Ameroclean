# AMERO order API — Cloudflare Worker config
#
# First deploy:
#   cd worker
#   wrangler deploy
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   # (optional) exact extra frontend origins beyond *.github.io and *.pages.dev:
#   wrangler secret put ALLOWED_ORIGINS
#
# Endpoints:
#   GET  /api/stock   live stock snapshot for the storefront
#   POST /api/order   place an order / admin restock
#
# Then paste the workers.dev URL from `wrangler deploy` into
# js/config.js (PROD_ORDER_API_URL) and re-push the site.

name = "amero-api"
main = "worker.mjs"
compatibility_date = "2025-09-01"

[durable_objects]
bindings = [{ name = "AMERO_STORE", class_name = "AmeroStore" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AmeroStore"]