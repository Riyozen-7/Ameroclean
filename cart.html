<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Amero</title>
  <meta name="description" content="Your Amero shopping cart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR (injected by js/layout.js) -->
  <header id="site-nav"></header>

  <!-- CART -->
  <section class="cart-page">
    <div class="container">
      <div class="section-header reveal" style="text-align:left;">
        <h2>Your Cart</h2>
      </div>

      <div class="cart-empty" id="cartEmpty" style="display:none;">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <p>Your cart is empty.</p>
        <a href="shop.html" class="btn btn-primary">Browse Products</a>
      </div>

      <div class="cart-layout" id="cartLayout">
        <div class="cart-items" id="cartItems"></div>
        <div class="billing-card reveal">
          <h3>Order Summary</h3>
          <div class="billing-row">
            <span>Subtotal</span>
            <span id="subtotal">৳0</span>
          </div>
          <div class="billing-row">
            <span>Delivery</span>
            <span id="deliveryFee">Calculated at checkout</span>
          </div>
          <div class="billing-row total">
            <span>Total</span>
            <span id="grandTotal">৳0</span>
          </div>
          <p class="billing-note">Delivery fee is confirmed at checkout based on your location &mdash; ৳70 inside Chittagong, ৳120 outside.</p>
          <a href="checkout.html" class="btn btn-primary" id="checkoutBtn">Proceed to Checkout</a>
          <a href="shop.html" class="btn btn-ghost" style="width:100%; margin-top: var(--sp-sm);">Continue Shopping</a>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER (injected by js/layout.js) -->
  <footer id="site-footer"></footer>

  <!-- SCRIPTS -->
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* CART PAGE — render items, quantity editing, totals */
    (function () {
      const cartItems = document.getElementById('cartItems');
      const cartEmpty = document.getElementById('cartEmpty');
      const cartLayout = document.getElementById('cartLayout');
      const subtotalEl = document.getElementById('subtotal');
      const grandTotalEl = document.getElementById('grandTotal');

      function render() {
        updateNavCartCount();

        if (cart.length === 0) {
          cartEmpty.style.display = 'block';
          cartLayout.style.display = 'none';
          return;
        }

        cartEmpty.style.display = 'none';
        cartLayout.style.display = 'grid';

        cartItems.innerHTML = cart.map(item => {
          const canIncrease = stockRemaining(item.id, item.size) > 0;
          return `
            <div class="cart-item" data-id="${item.id}" data-size="${escapeHtml(item.size)}">
              <div class="cart-item-img">
                <img ${imgAttr(item.img, item.name, '90px')}>
              </div>
              <div class="cart-item-details">
                <div class="cart-item-name">${escapeHtml(item.name)}</div>
                <div class="cart-item-meta">Size: ${escapeHtml(item.size)}</div>
                <div class="cart-item-price">${CURRENCY}${item.price} each</div>
              </div>
              <div class="cart-item-actions">
                <button class="qty-btn" data-action="dec" aria-label="Decrease quantity of ${escapeHtml(item.name)}">−</button>
                <span class="cart-item-qty" aria-live="polite">${item.qty}</span>
                <button class="qty-btn" data-action="inc" aria-label="Increase quantity of ${escapeHtml(item.name)}" ${canIncrease ? '' : 'disabled'}>+</button>
                <button class="remove-btn" data-action="remove" aria-label="Remove ${escapeHtml(item.name)} from cart">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                </button>
              </div>
            </div>
          `;
        }).join('');

        const subtotal = getCartTotal();
        subtotalEl.textContent = CURRENCY + subtotal;
        grandTotalEl.textContent = CURRENCY + subtotal;
      }

      /* Delegated handlers — no globals on window */
      cartItems.addEventListener('click', (e) => {
        const row = e.target.closest('.cart-item');
        if (!row) return;
        const id = parseInt(row.dataset.id, 10);
        const size = row.dataset.size;
        const actionBtn = e.target.closest('[data-action]');
        if (!actionBtn) return;
        const action = actionBtn.dataset.action;

        if (action === 'inc') changeQty(id, size, 1);
        else if (action === 'dec') changeQty(id, size, -1);
        else if (action === 'remove') removeFromCart(id, size);

        render();
      });

      /* Re-render when the cart changes from anywhere (this tab or another) */
      onCartChange(render);

      render();
    })();
  </script>
</body>
</html>
