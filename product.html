<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Product — Amero</title>
  <meta name="description" content="Amero premium clothing product.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR (injected by js/layout.js) -->
  <header id="site-nav"></header>

  <!-- PRODUCT DETAIL -->
  <section class="product-page">
    <div class="container">
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="breadcrumb-sep">&rsaquo;</span>
        <a href="shop.html">Shop</a>
        <span class="breadcrumb-sep">&rsaquo;</span>
        <span class="breadcrumb-current" id="breadcrumbName"></span>
      </nav>

      <div class="product-detail" id="productDetail">
        <!-- Rendered once by JS; only the changing nodes are updated afterwards -->
      </div>

      <div style="text-align: center; margin-top: var(--sp-4xl);" class="reveal">
        <h2 style="font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: var(--fw-light); color: var(--ink); margin-bottom: var(--sp-lg);">You may also like</h2>
        <div class="products-grid" id="relatedGrid"></div>
      </div>
    </div>
  </section>

  <!-- FOOTER (injected by js/layout.js) -->
  <footer id="site-footer"></footer>

  <!-- SCRIPTS -->
  <script src="js/layout.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* PRODUCT PAGE — render detail from ?id= query param.
       Builds the DOM once and updates only the nodes that change (gallery,
       size chips, quantity, button), avoiding destructive re-renders. */
    (function () {
      const params = new URLSearchParams(window.location.search);
      const productId = parseInt(params.get('id'), 10);
      const product = findProduct(productId);

      const container = document.getElementById('productDetail');
      if (!product) {
        container.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><p>Product not found.</p><a href="shop.html" class="btn btn-ghost">Back to shop</a></div>';
        document.getElementById('breadcrumbName').textContent = 'Not found';
        return;
      }

      document.title = product.name + ' — Amero';
      document.getElementById('pageTitle').textContent = product.name + ' — Amero';
      document.getElementById('breadcrumbName').textContent = product.name;

      let selectedSize = null;
      let qty = 1;
      let galleryActive = 0;

      /* Static skeleton — constructed once, then targeted updates below. */
      container.innerHTML = `
        <div class="product-gallery reveal in-view">
          <div class="gallery-main" id="galleryMain" role="button" tabindex="0" aria-label="Open image gallery">
            <img id="galleryMainImg" alt="">
          </div>
          <div class="gallery-thumbs" id="galleryThumbs"></div>
        </div>

        <div class="product-detail-info reveal in-view">
          <div class="stock-badge" id="stockBadge" style="margin-bottom: var(--sp-sm);">Only 1 piece per size</div>
          <h1 class="product-name" id="productName"></h1>
          <div class="product-price" id="productPrice"></div>
          <p class="product-desc" id="productDesc"></p>

          <div class="detail-section">
            <span class="detail-label" id="sizeLabel">Size</span>
            <div class="size-chips" id="sizeChips" role="group" aria-label="Select a size"></div>
          </div>

          <div class="detail-section">
            <span class="detail-label">Quantity</span>
            <div class="qty-selector">
              <button class="qty-btn" id="qtyMinus" aria-label="Decrease quantity">&minus;</button>
              <span class="qty-value" id="qtyValue" aria-live="polite">1</span>
              <button class="qty-btn" id="qtyPlus" aria-label="Increase quantity">+</button>
            </div>
          </div>

          <button class="btn btn-primary" id="addToCartBtn">Add to Cart</button>
          <p class="size-guide-note"><a href="policies.html#size-guide">Size guide &amp; measurements &rarr;</a></p>

          <div class="fabric-details">
            <h4>Quality &amp; Details</h4>
            <ul>
              <li id="fabricLine"></li>
              <li id="qualityLine"></li>
              <li>Hand-checked before shipping</li>
              <li>1 piece per size per run</li>
            </ul>
          </div>
        </div>
      `;

      const mainImg = document.getElementById('galleryMainImg');
      const galleryMain = document.getElementById('galleryMain');
      const galleryThumbs = document.getElementById('galleryThumbs');
      const sizeChips = document.getElementById('sizeChips');
      const qtyValue = document.getElementById('qtyValue');
      const qtyMinus = document.getElementById('qtyMinus');
      const qtyPlus = document.getElementById('qtyPlus');
      const addBtn = document.getElementById('addToCartBtn');

      document.getElementById('productName').textContent = product.name;
      document.getElementById('productPrice').textContent = CURRENCY + product.price;
      document.getElementById('productDesc').textContent = product.desc;
      document.getElementById('fabricLine').textContent = product.fabric;
      document.getElementById('qualityLine').textContent = 'Quality: ' + product.quality;

      /* ---------- Gallery (incremental) ---------- */
      function renderGallery() {
        mainImg.src = product.images[galleryActive];
        mainImg.srcset = imgSrcset(product.images[galleryActive]);
        mainImg.sizes = '(max-width: 968px) 100vw, 45vw';
        mainImg.alt = product.name;

        galleryThumbs.innerHTML = product.images.map((src, i) => `
          <button class="gallery-thumb${i === galleryActive ? ' active' : ''}" data-index="${i}"
                  aria-label="View image ${i + 1} of ${product.images.length}" aria-pressed="${i === galleryActive}">
            <img ${imgAttr(src, product.name + ' thumbnail', '72px')}>
          </button>
        `).join('');
      }

      galleryMain.addEventListener('click', () => openGallery(product.id));
      galleryMain.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openGallery(product.id);
        }
      });
      galleryThumbs.addEventListener('click', (e) => {
        const thumb = e.target.closest('.gallery-thumb');
        if (!thumb) return;
        galleryActive = parseInt(thumb.dataset.index, 10);
        renderGallery();
      });

      /* ---------- Size chips (incremental) ---------- */
      /* Auto-select a purchasable size. If the current selection sells out
         (live-stock refresh, or another tab's cart), move to the next one. */
      function renderSizes() {
        const currentRem = selectedSize ? stockRemaining(product.id, selectedSize) : 0;
        if (!selectedSize || currentRem <= 0) {
          const firstAvail = product.sizes.find(s => stockRemaining(product.id, s.size) > 0);
          if (firstAvail) selectedSize = firstAvail.size;
          else if (!selectedSize && product.sizes.length) selectedSize = product.sizes[0].size;
        }
        sizeChips.innerHTML = product.sizes.map(s => {
          const rem = stockRemaining(product.id, s.size);
          const out = rem <= 0;
          return `<button class="size-chip${s.size === selectedSize ? ' selected' : ''}${out ? ' sold-out' : ''}"
                          data-size="${escapeHtml(s.size)}" ${out ? 'disabled aria-disabled="true"' : ''}
                          aria-label="Size ${escapeHtml(s.size)}${out ? ', Out of stock' : ''}"
                          aria-pressed="${s.size === selectedSize}">${escapeHtml(s.size)}${out ? ' · Out' : ''}</button>`;
        }).join('');

        const badge = document.getElementById('stockBadge');
        if (badge) {
          const total = product.sizes.reduce((sum, s) => sum + (s.stock || 0), 0);
          badge.textContent = total <= 0 ? 'Sold out' : 'Only 1 piece per size';
        }
      }

      sizeChips.addEventListener('click', (e) => {
        const chip = e.target.closest('.size-chip');
        if (!chip || chip.disabled || chip.classList.contains('selected')) return;
        selectedSize = chip.dataset.size;
        qty = 1;
        renderSizes();
        syncState();
      });

      /* ---------- Quantity + Add-to-cart state (fixes stale stock/button) ---------- */
      function syncState() {
        const stockLeft = stockRemaining(product.id, selectedSize);

        if (stockLeft <= 0) {
          qty = 0;
          qtyValue.textContent = 0;
          qtyMinus.disabled = true;
          qtyPlus.disabled = true;
          addBtn.disabled = true;
          addBtn.textContent = 'Sold Out';
          return;
        }

        if (!Number.isInteger(qty) || qty < 1) qty = 1;
        if (qty > stockLeft) qty = stockLeft;

        qtyValue.textContent = qty;
        qtyMinus.disabled = qty <= 1;
        qtyPlus.disabled = qty >= stockLeft;
        addBtn.disabled = false;
        addBtn.textContent = 'Add to Cart';
      }

      qtyMinus.addEventListener('click', () => { qty -= 1; syncState(); });
      qtyPlus.addEventListener('click', () => { qty += 1; syncState(); });

      addBtn.addEventListener('click', () => {
        const stockLeft = stockRemaining(product.id, selectedSize);
        if (stockLeft <= 0 || qty < 1) return;

        if (addToCart(product.id, selectedSize, qty)) {
          showToast('Added to cart');
          addBtn.textContent = 'Added to Cart';
          addBtn.classList.add('added');
          setTimeout(() => {
            addBtn.classList.remove('added');
            // Show the true post-add state: stock may now be exhausted.
            syncState();
          }, 700);
          syncState();
        } else {
          showToast('This piece is no longer available');
          syncState();
        }
      });

      /* Re-evaluate stock/qty when the cart changes elsewhere (other tabs). */
      onCartChange(() => {
        renderSizes();
        syncState();
      });

      /* Live stock snapshot arrived from the API — reflect real availability. */
      onStockChange(() => {
        renderSizes();
        syncState();
      });

      /* ---------- Init ---------- */
      renderGallery();
      renderSizes();
      syncState();
      initScrollReveal();

      /* ---------- Related products ---------- */
      const related = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 3);
      const relatedGrid = document.getElementById('relatedGrid');

      function renderRelated() {
        if (related.length) {
          relatedGrid.innerHTML = related.map(p => productCardMarkup(p)).join('');
        } else {
          relatedGrid.innerHTML = '<div class="empty-state"><p>More pieces coming soon.</p></div>';
        }
        initScrollReveal();
      }

      renderRelated();
      onStockChange(renderRelated);
    })();
  </script>
</body>
</html>
